version: '3.8'

services:
  # 1. Edge Proxy (Data Plane & Control Plane)
  edge-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise/neuralwaf:v2.4.0
    container_name: neuralwaf-edge-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"  # Data Plane (Client Ingress)
      - "9090:9090"  # Control Plane (Prometheus Metrics & Healthz)
    environment:
      - UPSTREAM_URL=http://mock-upstream:8000
      - INFERENCE_ADDR=inference-server:50051
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - inference-server
      - kafka
      - mock-upstream
    networks:
      - waf-internal-net

  # 2. Inference Plane (LSTM Autoencoder Deep Learning Engine)
  inference-server:
    image: python:3.11-slim
    container_name: neuralwaf-inference-engine
    restart: unless-stopped
    command: >
      sh -c "echo 'Starting simulated TensorRT LSTM Autoencoder gRPC server on :50051...' &&
             while true; do sleep 3600; done"
    ports:
      - "50051:50051"
    networks:
      - waf-internal-net

  # 3. Telemetry Plane: Kafka Message Broker for Zima MDR
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: neuralwaf-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - waf-internal-net

  # 4. Protected Upstream Application
  mock-upstream:
    image: hashicorp/http-echo:0.2.3
    container_name: protected-backend
    restart: unless-stopped
    command: ["-text={\"status\":\"success\",\"message\":\"Request successfully proxied by NeuralWAF\",\"backend\":\"upstream-v1\"}", "-listen=:8000"]
    ports:
      - "8000:8000"
    networks:
      - waf-internal-net

networks:
  waf-internal-net:
    driver: bridge
